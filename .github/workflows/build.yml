# Checks and packages Whiplash on GitHub's macOS, Linux and Windows machines.
#
# Every push and pull request runs the tests and lint on all three systems.
# If they pass, the macOS app (.dmg), the Linux packages (.deb, AppImage)
# and the Windows installer (.msi) are built and attached to the run as
# downloadable "artifacts".
#
# Pushing a version tag (like v0.2.0) also publishes those packages as a
# GitHub Release; see "Making a release" in the README.
name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # Ubuntu 22.04 rather than the newest, so the Linux packages also
        # run on older distributions (they need at least its C library).
        os: [macos-latest, ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      # projectM's build makes deeply nested folders; keep their paths
      # short of Windows' limit. (The image has CMake, LLVM and vcpkg.)
      - name: Use a short build folder
        if: runner.os == 'Windows'
        run: echo "CARGO_TARGET_DIR=$env:RUNNER_TEMP\t" >> $env:GITHUB_ENV
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ pkg-config libasound2-dev libgl-dev libegl-dev libclang-dev
      - name: Lint
        run: cargo clippy --all-targets -- -D warnings
      - name: Lint without MilkDrop
        run: cargo clippy --all-targets --no-default-features -- -D warnings
      - name: Test
        run: cargo test

  macos-app:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: brew install librsvg
      - run: packaging/macos/build-app.sh --dmg
      - uses: actions/upload-artifact@v7
        with:
          name: whiplash-macos
          path: target/release/bundle/*.dmg

  linux-packages:
    needs: test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ pkg-config libasound2-dev libgl-dev libegl-dev libclang-dev librsvg2-bin file
      - run: cargo install cargo-deb --locked
      - run: packaging/linux/build-packages.sh
      - uses: actions/upload-artifact@v7
        with:
          name: whiplash-linux
          path: |
            target/release/bundle/*.deb
            target/release/bundle/*.AppImage

  windows-package:
    needs: test
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Use a short build folder
        run: echo "CARGO_TARGET_DIR=$env:RUNNER_TEMP\t" >> $env:GITHUB_ENV
      # WiX 5: later versions ask for a license to be accepted first.
      - name: Install WiX
        run: |
          dotnet tool install -g wix --version 5.*
          echo "$env:USERPROFILE\.dotnet\tools" >> $env:GITHUB_PATH
      - run: packaging/windows/build-msi.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: whiplash-windows
          path: ${{ runner.temp }}/t/release/bundle/*.msi

  release:
    # Only for version tags, once all the packages are built.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos-app, linux-packages, windows-package]
    runs-on: ubuntu-latest
    permissions:
      contents: write # to create the release
    steps:
      - uses: actions/checkout@v7
      - name: Check the tag matches the version in Cargo.toml
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match the version in Cargo.toml ($version)."
            exit 1
          fi
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l dist
          # A tag like v0.4.0-rc1 is a release candidate: a pre-release,
          # which doesn't become the "latest" release.
          prerelease=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then prerelease=(--prerelease); fi
          # Install notes first, then GitHub's list of changes since the last release.
          gh release create "$GITHUB_REF_NAME" dist/* "${prerelease[@]}" \
            --title "Whiplash Player ${GITHUB_REF_NAME#v}" \
            --notes-file packaging/release-notes.md \
            --generate-notes
