[package]
name = "whiplash"
version = "0.3.0"
edition = "2024"
description = "A music player for classic Winamp skins, with MilkDrop visualizations"
authors = ["Luke Hindman <luke@platypuscreations.net>"]
license = "GPL-3.0-or-later"
repository = "https://github.com/platypuscreations/whiplash"

# Settings for building a .deb package with `cargo deb` (see
# packaging/linux/build-packages.sh).
[package.metadata.deb]
section = "sound"
# "$auto" works out the system libraries the program links to.
depends = "$auto"
# zenity shows Whiplash's message boxes (file info, about) on Linux.
recommends = "zenity"
extended-description = """\
Plays MP3, FLAC, Ogg Vorbis, WAV, AIFF and AAC/ALAC files using classic \
Winamp 2.x skins (.wsz), with a 10-band equalizer, playlist editor and \
MilkDrop visualizations through projectM."""
assets = [
    ["target/release/whiplash", "usr/bin/", "755"],
    ["packaging/linux/whiplash.desktop", "usr/share/applications/", "644"],
    ["target/icons/whiplash.png", "usr/share/icons/hicolor/256x256/apps/", "644"],
    ["README.md", "usr/share/doc/whiplash/", "644"],
    ["THIRD-PARTY-NOTICES.md", "usr/share/doc/whiplash/", "644"],
    ["licenses/*", "usr/share/doc/whiplash/licenses/", "644"],
]

[dependencies]
anyhow = "1.0.104"
cpal = "0.18.2"
ctrlc = "3.5.2"
directories = "6.0.0"
fastrand = "2.5.0"
fontdb = "0.24.0"
glutin = { version = "0.32.3", optional = true }
glutin-winit = { version = "0.5.0", optional = true }
image = { version = "0.25.10", default-features = false, features = ["bmp"] }
projectm = { version = "3.1.2", features = ["static", "playlist"], optional = true }
raw-window-handle = { version = "0.6.2", optional = true }
pollster = "0.4.0"
rfd = "0.17.2"
ringbuf = "0.5.3"
rustfft = "6.4.1"
serde = { version = "1.0.229", features = ["derive"] }
skrifa = "0.44.0"
softbuffer = "0.4"
symphonia = { version = "0.6.1", features = ["all"] }
toml = "1.1.8"
winit = "0.30"
zeno = "0.3.3"
zip = { version = "9.0.3", default-features = false, features = ["deflate", "deflate64", "bzip2", "legacy-zip"] }

# macOS's own file dialogs, shown as free-standing windows (see
# src/app/dialogs/macos.rs), and raising windows (src/app/desktop.rs). The
# same versions rfd and winit use.
[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "block2", "NSApplication", "NSOpenPanel", "NSPanel", "NSResponder", "NSSavePanel", "NSView", "NSWindow"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSDictionary", "NSString", "NSURL", "NSValue"] }
objc2-media-player = { version = "0.3.2", default-features = false, features = ["std", "block2", "MPRemoteCommandCenter", "MPRemoteCommand", "MPRemoteCommandEvent", "MPNowPlayingInfoCenter", "MPMediaItem"] }

# Asking the X server where the mouse pointer is and to raise windows, on
# Linux (see src/app/desktop.rs). The version winit uses.
[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
async-channel = "2.5"
mpris-server = "0.10.0"
x11rb = "0.13.2"

# The Windows API: the console and message boxes (src/main.rs), the
# pointer and raising windows (src/app/desktop.rs), and the media controls
# (src/app/media/smtc.rs). The version cpal uses.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Foundation", "Media", "Win32_Foundation", "Win32_System_Console", "Win32_System_WinRT", "Win32_UI_WindowsAndMessaging"] }

# Locally fixed copies of the projectm crates (see vendor/*/PATCHES.md).
[patch.crates-io]
projectm = { path = "vendor/projectm" }
projectm-sys = { path = "vendor/projectm-sys" }

# Optimize dependencies even in debug builds: unoptimized audio decoding can
# be too slow to keep up with real-time playback.
[profile.dev.package."*"]
opt-level = 2

[features]
# MilkDrop visualizations through projectM. Building it compiles projectM's
# C++ source, which needs CMake and a C++ compiler. Build without it using
# `cargo build --no-default-features`.
default = ["milkdrop"]
milkdrop = ["dep:projectm", "dep:glutin", "dep:glutin-winit", "dep:raw-window-handle"]

# Smaller, faster release builds: optimize across crates, drop debug symbols.
[profile.release]
lto = "thin"
strip = "symbols"
